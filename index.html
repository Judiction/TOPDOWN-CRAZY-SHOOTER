<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doodle Duel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=block">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="sixteen-colors" color-interpolation-filters="sRGB">
      <feComponentTransfer>
        <feFuncR type="discrete" tableValues="0 0.5 1"/>
        <feFuncG type="discrete" tableValues="0 0.5 1"/>
        <feFuncB type="discrete" tableValues="0 0.5 1"/>
      </feComponentTransfer>
    </filter>
  </svg>
  <div id="screen">
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <div id="crt"></div>
  </div>
  <!-- PeerJS: browser-to-browser connections for online play -->
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
